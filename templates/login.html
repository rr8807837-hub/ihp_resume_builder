<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Resume Builder Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background-image: url("{{ url_for('static', filename='images/wholebg.png') }}");
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
}

/* BACKGROUND BLOBS */

.blob{
    position:fixed;
    border-radius:50%;
    filter:blur(100px);
    z-index:-1;
}

.blob1{
    width:500px;
    height:500px;
    background:#ff0055;
    top:30px;
    left:400px;
}

.blob2{
    width:500px;
    height:500px;
    background:#0066ff;
    bottom:-100px;
    right:600px;
}

.blob3{
    width:550px;
    height:550px;
    background:#00ff99;
    top:200px;
    right:250px;
}

/* GLASS LOGIN CARD */

.login-box{

    width:400px;
    padding:40px;
    /*background:linear-gradient(45deg,#24fe41,#fdfc47);*/
    /*background:linear-gradient(45deg,#833ab4,#fd1d1d,#fcb045);*/
    border-radius:25px;
    border: black solid 5px;
    box-shadow:0 8px 32px rgba(0,0,0,0.3);
    color:white;
    animation: float 3s ease-in-out infinite;
    background: transparent;
    backdrop-filter:blur(0.9px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid rgb(250, 248, 248);
}
@keyframes float {
    0%{transform: translateY(0px)}
    50%{transform: translateY(-20px)}
    100%{transform: translateY(0px)}
}
/* TITLE */

.login-box h1{
    text-align:center;
    margin-bottom:30px;
    font-size:40px;
}

.login-box span{
    /*background:linear-gradient(45deg,#833ab4,#fd1d1d,#fcb045);*/
    background:linear-gradient(45deg,#24fe41,#fdfc47);
    text-shadow: 0 0 15px rgba(36,254,65,0.5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* INPUTS */

.input-box{
    margin-bottom:20px;
}

.input-box input{

    width:100%;
    padding:15px;
    border:rgb(241, 234, 234) solid 2px;
    outline:none;
    border-radius:15px;
    background:linear-gradient(45deg,#24fe41,#fdfc47);
    box-shadow: 0 0 15px rgba(36,254,65,0.5);
    /*background:linear-gradient(45deg,#833ab4,#fd1d1d,#fcb045);*/
    color:rgb(9, 9, 9);
    font-size:16px;
}

.input-box input::placeholder{
    color:#121212;
}

/* BUTTON */

.login-btn{
    margin-left: 80px;
    width:50%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:linear-gradient(45deg,#24fe41,#fdfc47);
    box-shadow: 0 0 15px rgba(36,254,65,0.5);
    color:rgb(7, 7, 7);
    border: rgb(253, 252, 252) solid 2px;
    font-size:18px;
    cursor:pointer;

    transition:0.3s;
}

.login-btn:hover{
    transform:scale(1.03);
}

/* MESSAGE */

.message{
    margin-top:15px;
    text-align:center;
    color:#fff;
}
.login-box{
    position:relative;
    overflow:visible;
}



</style>
</head>

<body>

<!-- BLOBS -->

<!--
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div> -->


<!-- LOGIN CARD -->

<div class="login-box">

    <h1>Smart <span>Resume</span> Builder</h1>

    <form id="loginForm">

        <div class="input-box">
            <input 
                type="text"
                id="username"
                placeholder="Username"
                required
            >
        </div>

        <div class="input-box">
            <input 
                type="email"
                id="email"
                placeholder="Email"
                required
            >
        </div>

        <div class="input-box">
            <input 
                type="password"
                id="password"
                placeholder="Password"
                required
            >
        </div>

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>

    <div class="message" id="message" style="color: rgb(248, 247, 247);"></div>

</div>

<script>

document
.getElementById("loginForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    // INPUT VALUES

    const username =
    document.getElementById("username").value;

    const email =
    document.getElementById("email").value;

    const password =
    document.getElementById("password").value;

    // SEND DATA TO BACKEND

    const response = await fetch(
    "http://127.0.0.1:5000/login",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            username:username,
            email:email,
            password:password

        })

    });

    const data = await response.json();

    // SHOW MESSAGE

    document.getElementById("message").innerText =
    data.message;

    // IF LOGIN SUCCESS

    if(data.success){

        // SAVE TOKEN

        localStorage.setItem(
            "token",
            data.token
        );

        localStorage.setItem(
            "username",
            username
        );
        localStorage.setItem("email", email);
        setTimeout(()=>{

            window.location.href = "/";

        },1500);
    }
});

</script>

</body>
</html>
