<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simple Resume Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#111827;
    background-image: url("{{ url_for('static', filename='images/wholebg.png') }}");
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
    color:white;
    display:flex;
    height:100vh;
}

/* LEFT */

.sidebar{
    width:350px;
    background:#1f2937;
    padding:20px;
    overflow-y:auto;
}

.sidebar h2{
    margin-bottom:20px;
    color:#fbbf24;
}

.input-group{
    margin-bottom:15px;
}

.input-group label{
    display:block;
    margin-bottom:5px;
    font-size:14px;
}

.input-group input,
.input-group textarea,
.input-group select{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#374151;
    color:white;
}

textarea{
    resize:vertical;
    min-height:80px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin-top:10px;
    font-weight:bold;
}

.generate-btn{
    background:#fbbf24;
    color:black;
}

.download-btn{
    background:#2563eb;
    color:white;
}

/* CHIPS */

.chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:8px;
}

.chip{
    background:#374151;
    padding:6px 12px;
    border-radius:20px;
    cursor:pointer;
    font-size:13px;
}

.chip.selected{
    background:#fbbf24;
    color:black;
}

/* RIGHT */

.preview{
    flex:1;
    padding:30px;
    overflow-y:auto;
    background:#e5e7eb;
}

/* RESUME */

#resume{
    max-width:800px;
    margin:auto;
    background:white;
    color:black;
    padding:40px;
    border-radius:10px;
}

.header{
    text-align:center;
    margin-bottom:30px;
}

.header h1{
    font-size:34px;
}

.section{
    margin-top:25px;
}

.section h2{
    border-bottom:2px solid #fbbf24;
    padding-bottom:5px;
    margin-bottom:10px;
}

.skills{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.skill{
    background:#f3f4f6;
    padding:6px 12px;
    border-radius:20px;
    font-size:13px;
}
/* PAGE INTRO */

/* MINI INTRO */

#miniIntro{
    position:fixed;
    inset:0;

    background:#020617;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    z-index:999999;

    overflow:hidden;

    animation:introFade 0.6s ease forwards;
    animation-delay:2.5s;
}

.emoji-container{
    position:relative;

    width:220px;
    height:220px;

    display:flex;
    justify-content:center;
    align-items:center;
}

.main-emoji{
    font-size:85px;

    z-index:5;

    animation:mainFloat 2s ease-in-out infinite;

    filter:
    drop-shadow(0 0 20px rgba(251,191,36,0.7));
}

.floating{
    position:absolute;

    font-size:42px;

    opacity:0;

    animation-duration:1.2s;
    animation-fill-mode:forwards;
}

/* FLOATING POSITIONS */

.e1{
    top:10px;
    left:10px;

    animation-name:pop1;
    animation-delay:0.3s;
}

.e2{
    top:20px;
    right:0;

    animation-name:pop2;
    animation-delay:0.7s;
}

.e3{
    bottom:10px;
    left:20px;

    animation-name:pop3;
    animation-delay:1s;
}

/* LOADER */

.mini-loader{
    width:180px;
    height:6px;

    background:rgba(255,255,255,0.08);

    border-radius:30px;

    overflow:hidden;

    margin-top:30px;
}

.mini-loader-fill{
    width:0;
    height:100%;

    border-radius:30px;

    background:
    linear-gradient(90deg,#fbbf24,#fde68a);

    box-shadow:
    0 0 20px rgba(251,191,36,0.8);

    animation:loaderFill 2s forwards;
}

/* ANIMATIONS */

@keyframes loaderFill{

    to{
        width:100%;
    }
}

@keyframes mainFloat{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0px);
    }
}

@keyframes pop1{

    0%{
        opacity:0;
        transform:translate(40px,40px) scale(0.2);
    }

    100%{
        opacity:1;
        transform:translate(0,0) scale(1);
    }
}

@keyframes pop2{

    0%{
        opacity:0;
        transform:translate(-40px,40px) scale(0.2);
    }

    100%{
        opacity:1;
        transform:translate(0,0) scale(1);
    }
}

@keyframes pop3{

    0%{
        opacity:0;
        transform:translate(40px,-40px) scale(0.2);
    }

    100%{
        opacity:1;
        transform:translate(0,0) scale(1);
    }
}

@keyframes introFade{

    to{
        opacity:0;
        visibility:hidden;
    }
}
</style>
</head>

    <div class="mini-loader">

    </div>

</div>

<script>
const token = localStorage.getItem("token");

if(!token){

    alert("Please Login First");

    window.location.href = "/loginpage";
}

let data = {
skills:[],
strengths:[],
hobbies:[],
languages:[]
};

function addCustom(group,inputId){

    const input = document.getElementById(inputId);

    const value = input.value.trim();

    if(value === "") return;

    data[group].push(value);

    const container = input.previousElementSibling;

    container.innerHTML += `
        <div class="chip selected">
            ${value}
        </div>
    `;

    input.value = "";
}

function toggleChip(el,group){

    const value = el.innerText;

    el.classList.toggle("selected");

    if(el.classList.contains("selected")){
        data[group].push(value);
    }
    else{
        data[group] = data[group].filter(v => v !== value);
    }
}

            <p><b>${project2}</b></p>
